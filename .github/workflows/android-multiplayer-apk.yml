name: SM64 Android multiplayer APK

on:
  pull_request:
    branches:
      - feature/local-multiplayer
  push:
    branches:
      - feature/local-multiplayer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm64-android-multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    name: Check multiplayer sources (no ROM)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Android base
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout the multiplayer game branch
        uses: actions/checkout@v4
        with:
          repository: RonyxDumb/sm64-android-port
          ref: feature/local-multiplayer
          path: app/jni/src
          persist-credentials: false

      - name: Verify project layout and network module
        shell: bash
        run: |
          set -euo pipefail
          bash -n getSDL.sh
          bash app/jni/src/tests/run_netplay.sh
          test -f app/jni/src/Android.mk
          test -f app/jni/src/src/pc/netplay_lan.c
          test -f app/jni/src/src/pc/netplay_game.c
          gcc -std=gnu11 -Wall -Wextra -Werror -D__ANDROID__ \
            -Iapp/jni/src/src/pc -c app/jni/src/src/pc/netplay_lan.c -o /tmp/netplay-android.o
          gcc -std=gnu11 -Wall -Wextra -Werror \
            -Iapp/jni/src/src/pc -c app/jni/src/src/pc/netplay_lan.c -o /tmp/netplay-stub.o

  build-apk:
    name: Build APK (trusted branch + private ROM)
    needs: source-preflight
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feature/local-multiplayer'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check ROM configuration
        id: rom
        env:
          ROM_URL: ${{ secrets.SM64_ROM_DRIVE_URL }}
        shell: bash
        run: |
          if [[ -n "$ROM_URL" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Configure the SM64_ROM_DRIVE_URL repository secret to enable full APK builds.'
          fi

      - name: Checkout Android base
        if: steps.rom.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Checkout multiplayer game code
        if: steps.rom.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: RonyxDumb/sm64-android-port
          ref: feature/local-multiplayer
          path: app/jni/src
          persist-credentials: false

      - name: Set up Python for private ROM download
        if: steps.rom.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download private ROM from Google Drive
        if: steps.rom.outputs.ready == 'true'
        timeout-minutes: 6
        shell: bash
        env:
          ROM_URL: ${{ secrets.SM64_ROM_DRIVE_URL }}
          EXPECTED_SHA1: ${{ secrets.SM64_ROM_SHA1 }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.SM64_DRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          ROM_PATH="app/jni/src/baserom.us.z64"
          rm -f "$ROM_PATH"

          if [[ -n "$DRIVE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "Downloading ROM with authenticated Google Drive API (no public sharing required)."
            python -m pip install --disable-pip-version-check --quiet 'google-auth>=2.20,<3' 'requests>=2.31,<3'
            python - <<'PY'
          import json, os, pathlib, re, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          url = os.environ["ROM_URL"]
          match = re.search(r"/file/d/([a-zA-Z0-9_-]+)", url) or re.search(r"[?&]id=([a-zA-Z0-9_-]+)", url)
          if not match:
              raise SystemExit("ROM_URL is not a supported Google Drive file link.")
          try:
              info = json.loads(os.environ["DRIVE_SERVICE_ACCOUNT_JSON"])
              creds = service_account.Credentials.from_service_account_info(
                  info, scopes=["https://www.googleapis.com/auth/drive.readonly"]
              )
              session = AuthorizedSession(creds)
              response = session.get(
                  "https://www.googleapis.com/drive/v3/files/" + match.group(1),
                  params={"alt": "media"}, stream=True, timeout=(15, 45)
              )
              if response.status_code != 200:
                  raise RuntimeError("Google Drive returned HTTP " + str(response.status_code))
              dest = pathlib.Path("app/jni/src/baserom.us.z64")
              with dest.open("wb") as output:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          output.write(chunk)
              response.close()
          except Exception as exc:
              pathlib.Path("app/jni/src/baserom.us.z64").unlink(missing_ok=True)
              raise SystemExit(
                  "Authenticated Drive download failed (" + str(type(exc).__name__) + "). "
                  "Ensure Drive API is enabled and the ROM is shared with the service-account email."
              ) from None
          PY
          else
            echo "No Drive service account configured; trying an anonymously downloadable link."
            python -m pip install --disable-pip-version-check --quiet 'gdown==5.2.0'
            success=false
            for attempt in 1 2; do
              echo "Drive download attempt $attempt/2 (90-second limit)."
              rm -f "$ROM_PATH"
              if timeout --signal=TERM --kill-after=5s 90s \
                gdown --quiet --fuzzy "$ROM_URL" -O "$ROM_PATH" \
                > /tmp/sm64-drive-download.log 2>&1; then
                success=true
                break
              fi
              echo "::warning::Drive download attempt $attempt failed or timed out."
              if grep -Eqi 'permission|cannot retrieve the public link|access denied|need access' /tmp/sm64-drive-download.log; then
                echo "::error::Google Drive denied anonymous access. Use SM64_DRIVE_SERVICE_ACCOUNT_JSON for authenticated downloading."
                break
              fi
            done
            if [[ "$success" != true ]]; then
              rm -f "$ROM_PATH"
              echo "::error::ROM download failed. Verify Drive access or configure authenticated access; no ROM is included in this repository."
              exit 1
            fi
          fi

          python - <<'PY'
          import hashlib, os, pathlib
          p = pathlib.Path("app/jni/src/baserom.us.z64")
          if not p.is_file() or p.stat().st_size != 8 * 1024 * 1024:
              p.unlink(missing_ok=True)
              raise SystemExit("Expected an 8 MiB unmodified US SM64 ROM, not HTML or an archive.")
          expected = os.environ.get("EXPECTED_SHA1", "").strip().lower()
          if expected and hashlib.sha1(p.read_bytes()).hexdigest() != expected:
              p.unlink(missing_ok=True)
              raise SystemExit("ROM SHA-1 did not match SM64_ROM_SHA1.")
          print("ROM downloaded and size validated (SHA-1 checked when configured).")
          PY

      - name: Install JDK 17 for Android SDK command-line tools
        if: steps.rom.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages from runner SDK
        if: steps.rom.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # Avoid setup-android@v3 requesting the removed legacy 'tools' package.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-28' 'build-tools;30.0.3' 'ndk;21.4.7075529' 'platform-tools'

      - name: Compile Android Java frontend against API 28
        if: steps.rom.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/sm64-java-check
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-28/android.jar" \
            -d /tmp/sm64-java-check $(find app/src/main/java -name '*.java')

      - name: Switch to JDK 11 for legacy Gradle 7.1
        if: steps.rom.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install native build dependencies
        if: steps.rom.outputs.ready == 'true'
        timeout-minutes: 8
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          echo "::group::Refresh APT package lists (with network retries and timeouts)"
          sudo -E apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          echo "::endgroup::"
          echo "::group::Install native build dependencies"
          sudo -E apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            build-essential clang cmake pkg-config python3 python3-venv \
            unzip zip libpng-dev libaudiofile-dev libgl1-mesa-dev \
            libglew-dev libglfw3-dev libx11-dev libxrandr-dev \
            libusb-1.0-0-dev libasound2-dev libpulse-dev
          echo "::endgroup::"

      - name: Prepare SDL2
        if: steps.rom.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pkg-config --print-errors --exists xrandr libusb-1.0
          bash getSDL.sh

      - name: Generate assets and build native prerequisites
        if: steps.rom.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          make -C app/jni/src -j2 VERSION=us

      - name: Compile debug Android APK
        id: gradle
        if: steps.rom.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Check encryption configuration
        id: archive
        if: steps.gradle.outcome == 'success'
        shell: bash
        env:
          APK_PASSWORD: ${{ secrets.SM64_APK_ENCRYPTION_PASSWORD }}
        run: |
          if [[ -n "$APK_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::APK built, but not uploaded. Set SM64_APK_ENCRYPTION_PASSWORD to upload an encrypted artifact.'
          fi

      - name: Encrypt APK before uploading
        if: steps.archive.outputs.ready == 'true'
        shell: bash
        env:
          APK_PASSWORD: ${{ secrets.SM64_APK_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in app/build/outputs/apk/debug/app-debug.apk \
            -out sm64-multiplayer.apk.enc -pass env:APK_PASSWORD

      - name: Upload encrypted APK
        if: steps.archive.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sm64-multiplayer-apk-encrypted
          path: sm64-multiplayer.apk.enc
          if-no-files-found: error
          retention-days: 7

      - name: Remove ROM from workspace
        if: always()
        shell: bash
        run: rm -f app/jni/src/baserom.us.z64
